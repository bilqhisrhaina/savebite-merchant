<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Produk - SaveBite Merchant</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>


<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        🌱 SAVEBITE
    </div>


    <div class="merchant-profile">

        <div class="avatar">
            🍽️
        </div>

        <div>
            <h4>Resto Kita</h4>
            <p>Partner SaveBite</p>
        </div>

    </div>



    <nav>

        <a href="index.html">
            🏠 Dashboard
        </a>


        <a class="active">
            📦 Kelola Produk
        </a>


        <a href="orders.html">
            📝 Pesanan Masuk
        </a>


        <a>
            🏪 Profil Restoran
        </a>


        <a>
            ❓ Bantuan
        </a>


        <a class="logout">
            🚪 Keluar
        </a>


    </nav>


</aside>





<!-- CONTENT -->
<main class="content">


<header class="topbar">

    <div>

        <h1>
            Tambah Produk Surplus
        </h1>

        <p>
            Tambahkan makanan yang masih layak konsumsi agar tidak terbuang.
        </p>

    </div>


</header>


<form class="form-container" id="productForm">



<div class="upload-box">

    <label for="productImage">

        <div class="upload-icon">
            📷
        </div>

        <p>
            Klik untuk upload foto
        </p>

        <small>
            atau drag and drop
        </small>

    </label>


    <input 
        type="file"
        id="productImage"
        accept="image/*"
    >

    <img id="previewImage">

</div>


</div>





<div class="form-right">


<label>
    Nama Makanan
</label>

<input 
id="productName"
type="text"
placeholder="Contoh: Nasi Ayam Teriyaki">





<label>
    Deskripsi
</label>

<textarea
placeholder="Tulis deskripsi singkat makanan">
</textarea>





<div class="two-column">


<div>

<label>
Harga Normal

</label>

<input 
id="normalPrice"
type="text"
placeholder="Contoh: Rp25.000">

</div>



<div>

<label>
Harga Surplus
<small class="helper-text">
Harga makanan setelah disesuaikan oleh merchant untuk mengurangi food waste.
</small>
</label>

<input 
id="surplusPrice"
type="text"
placeholder="Contoh: Rp15.000">

</div>


</div>






<div class="two-column">


<div>

<label>
Jumlah Stok
</label>

<input 
id="stock"
type="number"
placeholder="0">

</div>



<div>

<label>
Batas Pengambilan
</label>

<input 
type="datetime-local">

</div>


</div>




<div class="form-button">


<button class="cancel">
    Batal
</button>


<button 
type="submit"
class="primary-btn">

Publikasikan Produk

</button>

</button>


</div>



</div>



</section>





</main>

<script src="js/script.js"></script>

</body>

</html>
